appId: tv.hollr.app
productName: Hollr
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!out/tsc-app/**'
asar: true
asarUnpack:
  - '**/node_modules/sherpa-onnx-*/**'
win:
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
msi:
  oneClick: false
  perMachine: false
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.entertainment
  extendInfo:
    NSMicrophoneUsageDescription: Hollr listens to your microphone for voice commands. Audio never leaves your computer.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  artifactName: ${productName}-${version}-${arch}.${ext}
# Owner and repo come from package.json "repository", so release builds get a correct app-update.yml.
publish:
  provider: github
